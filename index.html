<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escala de Entrega · CD Nova Santa Rita</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{color-scheme:light;--g1:#D8D8D8;--g2:#BFBFBF;--dk:#262626;--amb:#FFC000;--xl:#217346;--navy:#0E1B3D;--navy2:#16265A;--amber:#E48B00}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#E9EAEE;color:#000;font:14px Arial,Helvetica,sans-serif}

/* barra de ferramentas (não imprime) */
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:3px solid var(--amber)}
.bar b{font:600 15px Arial,sans-serif;margin-right:auto}
.bar button{font:600 12.5px Arial,sans-serif;border-radius:6px;padding:8px 12px;border:1px solid #3A4A82;background:var(--navy2);color:#fff;cursor:pointer}
.bar button:hover{background:#1E3273}
.bar button.pri{background:var(--amber);border-color:var(--amber);color:#1B1200}
.bar .saved{font-size:12px;color:#AEB9DA;min-width:70px}
.bar button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input[type=file]{display:none}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#333;padding:10px 2px 0}
.sum span b{font-size:14px;color:#000}

/* folha */
.sheet{max-width:1400px;margin:16px auto 40px;padding:0 16px}
.page{background:#fff;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.2);overflow-x:auto}
.head{display:flex;justify-content:space-between;align-items:stretch;gap:16px;margin-bottom:14px}
.head .tt{display:flex;align-items:center;font:700 22px Arial,sans-serif}
.head .tt input{font:inherit;border:0;background:transparent;width:min(640px,60vw);padding:4px 0}
.date{background:var(--amb);border:3px solid #000;display:flex;align-items:center;padding:6px 14px;font:700 20px Arial,sans-serif}
.date input{font:inherit;border:0;background:transparent;color:#000}

table.esc{border-collapse:collapse;width:100%;min-width:1080px;font:700 14px Arial,sans-serif;table-layout:fixed}
.esc th,.esc td{border:2px solid #000;padding:0;text-align:center;vertical-align:middle}
.esc thead tr.pcp th{background:var(--g1);font-size:19px;height:34px;border:3px solid #000}
.esc thead tr.cols th{background:var(--g1);font-size:13px;height:54px;padding:2px 4px;line-height:1.15}
.esc tr.sec td{background:var(--dk);color:#fff;height:58px}
.esc tr.sec input{color:#fff;font:700 21px Arial,sans-serif;text-align:center;text-transform:uppercase}
.esc td.g{background:var(--g2)}
.esc tr.row td{height:40px}
.esc input{display:block;width:100%;height:100%;min-height:38px;border:0;margin:0;padding:0 4px;background:transparent;font:inherit;color:inherit;text-align:center;border-radius:0}
.esc input:focus{outline:3px solid var(--xl);outline-offset:-3px;background:rgba(33,115,70,.07)}
.esc tr.row:hover td:not(.g):not(.act){background:#F3F6FB}
.esc tr.row:hover td.g{background:#B3B7BF}
/* coluna de ações, fora da planilha */
.esc th.act,.esc td.act,.esc thead tr th.act{border:0!important;background:transparent!important;width:30px}
.x{border:0;background:transparent;color:#999;font-size:18px;line-height:1;cursor:pointer;padding:6px;border-radius:4px;opacity:0}
tr:hover .x,.x:focus-visible{opacity:1}
.x:hover{color:#C0392B;background:#FBE3E0}
.x:focus-visible{outline:2px solid var(--xl)}
tr.sec .x{color:#bbb}
.addrow td{border:0!important;height:auto!important;background:transparent!important;text-align:left;padding:4px 0 12px!important}
.addrow button{font:600 12px Arial,sans-serif;border:1px dashed #888;background:#fff;color:#333;border-radius:6px;padding:6px 10px;cursor:pointer}
.addrow button:hover{border-color:var(--xl);color:var(--xl)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--amber);padding:10px 14px;border-radius:8px;font-size:13px;z-index:20;display:none;align-items:center;gap:12px;max-width:92vw}
.toast button{background:transparent;border:1px solid #fff;color:#fff;border-radius:6px;padding:4px 10px;font:600 12px Arial,sans-serif;cursor:pointer}
.hint{font-size:12px;color:#555;margin:10px 2px 0}

@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,.addrow,.act,.hint,.sum,.toast{display:none!important}
  col.actc{width:0!important}
  .date input::-webkit-calendar-picker-indicator{display:none}
  .sheet{margin:0;padding:0;max-width:none}
  .page{box-shadow:none;padding:0;overflow:visible}
  table.esc{min-width:0;font-size:11px}
  .esc tr.row td{height:26px}.esc input{min-height:24px}
  .esc tr.sec td{height:34px}.esc tr.sec input{font-size:15px}
  .esc thead tr.cols th{height:36px;font-size:10.5px}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="bar">
  <b>Escala de Entrega · PCP</b>
  <span class="saved" id="saved" aria-live="polite"></span>
  <button type="button" id="bImp">Importar Excel</button>
  <button type="button" id="bExp">Baixar Excel</button>
  <button type="button" id="bSec">+ Seção</button>
  <button type="button" id="bNew">Nova escala</button>
  <button type="button" id="bPrint" class="pri">Imprimir</button>
  <input type="file" id="fImp" accept=".xlsx">
</div>

<div class="sheet">
  <div class="page">
    <div class="head">
      <div class="tt"><input id="title" aria-label="Título"></div>
      <label class="date"><input type="date" id="date" aria-label="Data da escala"></label>
    </div>
    <table class="esc" id="tbl">
      <colgroup>
        <col style="width:6%"><col style="width:6%"><col style="width:8%"><col style="width:10%"><col style="width:7%"><col style="width:6%">
        <col style="width:10%"><col style="width:15%"><col style="width:9%"><col style="width:11%"><col style="width:12%"><col class="actc" style="width:30px">
      </colgroup>
      <thead>
        <tr class="pcp"><th colspan="11">PCP</th><th class="act"></th></tr>
        <tr class="cols"><th>LOJA</th><th>PAV</th><th>LOJAS</th><th>TIPO DE CARGA</th><th>QTD PALLET</th><th>DOCA</th><th>PESO</th><th>OBSERVAÇÃO</th><th>MASTER</th><th>CARGAS INFORMADAS</th><th>STATUS</th><th class="act"></th></tr>
      </thead>
    </table>
    <div class="sum" id="sum"></div>
  </div>
  <p class="hint">Navegue como no Excel: setas, Enter e Tab. Dá para colar um bloco copiado do Excel direto numa célula; linhas novas são criadas na seção.</p>
</div>
<div class="toast" id="toast" role="status"><span id="tMsg"></span><button type="button" id="tUndo">Desfazer</button></div>

const COLS = ['LOJA','PAV','LOJAS','TIPO DE CARGA','QTD PALLET','DOCA','PESO','OBSERVAÇÃO','MASTER','CARGAS INFORMADAS','STATUS'];
const NC = COLS.length, GRAY = new Set([0,3]);   // LOJA e TIPO DE CARGA têm fundo cinza, como na planilha
const LS_KEY = 'cd107_escala_pcp_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const blank = () => new Array(NC).fill('');

let state, undoSnap=null, saveT, toastT;

function defaults(){
  return {title:'Escala de Entrega - CD Nova Santa Rita', date:today(),
    sections:[{title:'CARGAS DO PV 1',rows:[blank(),blank(),blank()]},{title:'CARGAS PERECIVEIS',rows:[blank(),blank(),blank()]}]};
}
function load(){
  try{ const s=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(s&&Array.isArray(s.sections)) return s; }catch(e){}
  return {title:'Escala de Entrega - CD Nova Santa Rita', date:today(),
    sections:SEED.map(s=>({title:s.title,rows:s.rows.length?s.rows.map(r=>r.slice(0,NC)):[blank(),blank(),blank()]}))};
}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); $('#saved').textContent='Salvo'; }catch(e){ $('#saved').textContent='Não salvo'; } },350);
  $('#saved').textContent='Salvando…';
}
function toast(msg,undo){
  $('#tMsg').textContent=msg; $('#tUndo').style.display=undo?'':'none'; $('#toast').style.display='flex';
  clearTimeout(toastT); toastT=setTimeout(()=>$('#toast').style.display='none',6000);
}
function snapshot(){ undoSnap=JSON.stringify(state); }

/* ============ PESO: "360.7 kg", "1,930 kg" (vírgula de milhar), "1.930,5 kg" ============ */
function parsePeso(v){
  let s=String(v||'').toLowerCase().replace(/kg/g,'').replace(/\s/g,'');
  if(!s) return 0;
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,'');          // 1,930 / 12,345.6
  else if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); // 1.930,5
  else s=s.replace(',','.');
  return parseFloat(s)||0;
}
const num = v => { const n=parseFloat(String(v||'').replace(',','.')); return isNaN(n)?0:n; };

/* ============ RENDER ============ */
function render(focus){
  $('#title').value=state.title; $('#date').value=state.date||'';
  const t=$('#tbl'); t.querySelectorAll('tbody').forEach(b=>b.remove());
  state.sections.forEach((s,si)=>{
    const tb=document.createElement('tbody');
    tb.innerHTML=`<tr class="sec"><td colspan="${NC}"><input data-sec="${si}" value="${esc(s.title)}" aria-label="Título da seção"></td>
      <td class="act"><button type="button" class="x" data-dsec="${si}" title="Excluir seção" aria-label="Excluir seção ${esc(s.title)}">×</button></td></tr>`
      + s.rows.map((r,ri)=>`<tr class="row">${r.map((v,c)=>`<td${GRAY.has(c)?' class="g"':''}><input data-s="${si}" data-i="${ri}" data-c="${c}" value="${esc(v)}" aria-label="${COLS[c]} linha ${ri+1}"></td>`).join('')}
        <td class="act"><button type="button" class="x" data-drow="${si}:${ri}" title="Excluir linha" aria-label="Excluir linha ${ri+1}">×</button></td></tr>`).join('')
      + `<tr class="addrow"><td colspan="${NC+1}"><button type="button" data-add="${si}">+ Linha em ${esc(s.title)}</button></td></tr>`;
    t.appendChild(tb);
  });
  summary();
  if(focus) focusCell(...focus);
}
function summary(){
  let n=0,pal=0,kg=0; const pav={};
  state.sections.forEach(s=>s.rows.forEach(r=>{ if(!r.some(v=>String(v).trim())) return; n++; pal+=num(r[4]); kg+=parsePeso(r[6]); if(r[1]) pav[r[1]]=(pav[r[1]]||0)+1; }));
  $('#sum').innerHTML=`<span>Cargas <b>${n.toLocaleString('pt-BR')}</b></span><span>Pallets <b>${pal.toLocaleString('pt-BR')}</b></span><span>Peso total <b>${kg.toLocaleString('pt-BR',{maximumFractionDigits:0})} kg</b></span>`
    + Object.keys(pav).sort().map(k=>`<span>${esc(k)} <b>${pav[k]}</b></span>`).join('');
}
function focusCell(si,ri,c){
  const el=document.querySelector(`input[data-s="${si}"][data-i="${ri}"][data-c="${c}"]`);
  if(el){ el.focus(); el.select(); }
}

/* ============ EDIÇÃO ============ */
const tbl=$('#tbl');
tbl.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.sec!==undefined){ state.sections[+el.dataset.sec].title=el.value; save(); return; }
  if(el.dataset.c===undefined) return;
  state.sections[+el.dataset.s].rows[+el.dataset.i][+el.dataset.c]=el.value; save(); summary();
});
tbl.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.add!==undefined){ const si=+b.dataset.add; state.sections[si].rows.push(blank()); save(); render([si,state.sections[si].rows.length-1,0]); }
  else if(b.dataset.drow){ const [si,ri]=b.dataset.drow.split(':').map(Number); snapshot(); state.sections[si].rows.splice(ri,1); save(); render(); toast('Linha excluída.',true); }
  else if(b.dataset.dsec!==undefined){ const si=+b.dataset.dsec; snapshot(); const t=state.sections[si].title; state.sections.splice(si,1); save(); render(); toast(`Seção "${t}" excluída.`,true); }
});

/* navegação estilo Excel: setas, Enter / Shift+Enter; Enter na última linha cria outra */
function flat(){ const f=[]; state.sections.forEach((s,si)=>s.rows.forEach((_,ri)=>f.push([si,ri]))); return f; }
tbl.addEventListener('keydown',e=>{
  const el=e.target; if(el.dataset.c===undefined) return;
  const si=+el.dataset.s, ri=+el.dataset.i, c=+el.dataset.c;
  const f=flat(), pos=f.findIndex(p=>p[0]===si&&p[1]===ri);
  const go=(p,col)=>{ if(p>=0&&p<f.length){ e.preventDefault(); focusCell(f[p][0],f[p][1],col); } };
  const atStart=el.selectionStart===0&&el.selectionEnd===0, atEnd=el.selectionStart===el.value.length&&el.selectionEnd===el.value.length;
  const allSel=el.selectionStart===0&&el.selectionEnd===el.value.length;
  if(e.key==='ArrowDown') go(pos+1,c);
  else if(e.key==='ArrowUp') go(pos-1,c);
  else if(e.key==='Enter'){
    if(e.shiftKey) return go(pos-1,c);
    if(pos===f.length-1 || f[pos+1][0]!==si){   // última linha da seção: cria uma nova
      e.preventDefault(); state.sections[si].rows.splice(ri+1,0,blank()); save(); render([si,ri+1,c]); return;
    }
    go(pos+1,c);
  }
  else if(e.key==='ArrowRight' && (atEnd||allSel) && c<NC-1){ e.preventDefault(); focusCell(si,ri,c+1); }
  else if(e.key==='ArrowLeft' && (atStart||allSel) && c>0){ e.preventDefault(); focusCell(si,ri,c-1); }
  else if(e.key==='Delete' && e.ctrlKey){ e.preventDefault(); snapshot(); state.sections[si].rows.splice(ri,1); save(); render(pos<f.length-1&&f[pos+1][0]===si?[si,ri,c]:null); toast('Linha excluída.',true); }
});

/* colar bloco do Excel (linhas separadas por quebra, colunas por TAB) */
tbl.addEventListener('paste',e=>{
  const el=e.target; if(el.dataset.c===undefined) return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');
  if(!/[\t\n]/.test(txt.replace(/\r?\n$/,''))) return;
  e.preventDefault(); snapshot();
  const si=+el.dataset.s, ri=+el.dataset.i, c0=+el.dataset.c, rows=state.sections[si].rows;
  const lines=txt.replace(/\r/g,'').replace(/\n$/,'').split('\n');
  lines.forEach((ln,k)=>{
    if(!rows[ri+k]) rows.splice(ri+k,0,blank());
    ln.split('\t').forEach((v,j)=>{ if(c0+j<NC) rows[ri+k][c0+j]=v.trim(); });
  });
  save(); render([si,ri,c0]); toast(`${lines.length} linha(s) colada(s).`,true);
});

$('#title').addEventListener('input',e=>{ state.title=e.target.value; save(); });
$('#date').addEventListener('input',e=>{ state.date=e.target.value; save(); });
$('#tUndo').addEventListener('click',()=>{ if(!undoSnap) return; state=JSON.parse(undoSnap); undoSnap=null; save(); render(); $('#toast').style.display='none'; });
$('#bSec').addEventListener('click',()=>{ const t=prompt('Nome da seção','CARGAS DO PV 2'); if(!t) return; state.sections.push({title:t.toUpperCase(),rows:[blank()]}); save(); render([state.sections.length-1,0,0]); });
$('#bNew').addEventListener('click',()=>{ if(!confirm('Começar uma escala em branco? A atual será substituída (baixe o Excel antes, se quiser guardar).')) return; snapshot(); state=defaults(); save(); render([0,0,0]); toast('Escala nova criada.',true); });
$('#bPrint').addEventListener('click',()=>window.print());

/* ============ IMPORTAR (mesmo layout da Escala.xlsx) ============ */
const cellTxt = c => { if(c.isMerged && c.master && c.master.address!==c.address) return ''; const v=c.value; if(v==null) return ''; if(v instanceof Date) return `${pad2(v.getUTCDate())}/${pad2(v.getUTCMonth()+1)}/${v.getUTCFullYear()}`; if(typeof v==='object'){ if(v.richText) return v.richText.map(x=>x.text).join(''); if('result' in v) return String(v.result??''); if(v.text) return String(v.text); } return String(v).trim(); };
$('#bImp').addEventListener('click',()=>$('#fImp').click());
$('#fImp').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
    const ws=wb.worksheets[0]; let hdr=0, title='Escala de Entrega - CD Nova Santa Rita', date=null;
    for(let r=1;r<=Math.min(ws.rowCount,40);r++){
      for(let c=1;c<=18;c++){
        const cell=ws.getRow(r).getCell(c), t=cellTxt(cell);
        if(!hdr && c===1 && /^loja$/i.test(t)) hdr=r;
        if(/escala/i.test(t)) title=t;
        if(cell.value instanceof Date) date=cell.value.toISOString().slice(0,10);
        const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t); if(m&&!date) date=`${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
      }
    }
    if(!hdr) throw new Error('não achei o cabeçalho LOJA / PAV / LOJAS…');
    const secs=[]; let cur=null;
    for(let r=hdr+1;r<=ws.rowCount;r++){
      const v=[]; for(let c=1;c<=NC;c++) v.push(cellTxt(ws.getRow(r).getCell(c)));
      if(!v.some(Boolean)) continue;
      const filled=v.filter(Boolean);
      if(filled.length===1 && !/^[\d.,\s]+(kg)?$/i.test(filled[0])){   // linha de seção: um único texto (ex.: CARGAS DO PV 1)
        cur={title:v.find(Boolean).toUpperCase(),rows:[]}; secs.push(cur); continue; }
      if(!cur){ cur={title:'CARGAS',rows:[]}; secs.push(cur); }
      cur.rows.push(v);
    }
    if(!secs.length) throw new Error('nenhuma linha de carga encontrada');
    secs.forEach(s=>{ if(!s.rows.length) s.rows.push(blank()); });
    snapshot(); state={title,date:date||state.date||today(),sections:secs}; save(); render();
    toast(`Importado: ${secs.reduce((a,s)=>a+s.rows.filter(r=>r.some(Boolean)).length,0)} cargas em ${secs.length} seção(ões).`,true);
  }catch(err){ alert('Não consegui importar: '+err.message); }
});

/* ============ EXPORTAR com a mesma formatação da planilha ============ */
$('#bExp').addEventListener('click',async()=>{
  const wb=new ExcelJS.Workbook(), ws=wb.addWorksheet('Plan1',{pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.3,right:.3,top:.4,bottom:.4,header:.2,footer:.2}}});
  ws.columns=[8,8,11,14,10,8,13,22,12,14,14].map(w=>({width:w}));
  const B=s=>({style:s,color:{argb:'FF000000'}}), box=s=>({top:B(s),left:B(s),bottom:B(s),right:B(s)});
  const fill=a=>({type:'pattern',pattern:'solid',fgColor:{argb:a}});
  const mid={vertical:'middle',horizontal:'center',wrapText:true};
  const [y,m,d]=(state.date||today()).split('-');
  ws.mergeCells('A1:H1'); Object.assign(ws.getCell('A1'),{value:state.title,font:{name:'Arial',size:16,bold:true},alignment:{vertical:'middle'}});
  ws.mergeCells('J1:K1'); Object.assign(ws.getCell('J1'),{value:`${d}/${m}/${y}`,font:{name:'Arial',size:14,bold:true},fill:fill('FFFFC000'),alignment:mid,border:box('thick')});
  ws.getRow(1).height=37.5;
  ws.mergeCells('A3:K3'); Object.assign(ws.getCell('A3'),{value:'PCP',font:{name:'Arial',size:14,bold:true},fill:fill('FFD8D8D8'),alignment:mid,border:box('thick')});
  ws.getRow(3).height=22;
  COLS.forEach((h,i)=>Object.assign(ws.getRow(4).getCell(i+1),{value:h,font:{name:'Arial',size:12,bold:true},fill:fill('FFD8D8D8'),alignment:mid,border:box('medium')}));
  ws.getRow(4).height=48;
  const NUMC=new Set([0,4,5,9]);
  let r=5;
  state.sections.forEach(s=>{
    ws.mergeCells(r,1,r,NC);
    Object.assign(ws.getCell(r,1),{value:s.title,font:{name:'Arial',size:17,bold:true,color:{argb:'FFFFFFFF'}},fill:fill('FF262626'),alignment:mid,border:box('medium')});
    ws.getRow(r).height=45; r++;
    s.rows.forEach(row=>{
      row.forEach((v,c)=>{
        const cell=ws.getRow(r).getCell(c+1), t=String(v??'').trim();
        cell.value = NUMC.has(c) && /^\d+$/.test(t) ? +t : (t||null);
        cell.font={name:'Arial',size:12,bold:true}; cell.alignment=mid; cell.border=box('medium');
        cell.fill=fill(GRAY.has(c)?'FFBFBFBF':'FFFFFFFF');
      });
      ws.getRow(r).height=30; r++;
    });
  });
  ws.pageSetup.printTitlesRow='3:4';
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=`Escala_${d}-${m}-${y}.xlsx`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});

state=load(); render();
</script>
